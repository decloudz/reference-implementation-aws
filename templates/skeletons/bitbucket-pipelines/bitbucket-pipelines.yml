# Bitbucket Pipelines configuration for ${{ values.repoName }}
# Generated by Backstage template

image: node:18

pipelines:
  default:
    - step:
        name: Build and Test
        caches:
          - node
        script:
          - echo "Building ${{ values.repoName }}..."
          {% if values.ci %}
          {% if values.imageBuilder == "s2i-nodejs" %}
          - npm ci
          - npm run build
          - npm test
          {% elif values.imageBuilder == "s2i-java" %}
          - mvn clean install
          - mvn test
          {% elif values.imageBuilder == "s2i-go" %}
          - go mod download
          - go build ./...
          - go test ./...
          {% endif %}
          {% endif %}
          - echo "Build completed successfully"
        artifacts:
          - dist/**
          - target/**
          - bin/**

  branches:
    main:
      - step:
          name: Build, Test and Deploy
          deployment: production
          caches:
            - node
            - maven
            - docker
          services:
            - docker
          script:
            - echo "Building for production..."
            {% if values.ci %}
            {% if values.imageBuilder == "s2i-nodejs" %}
            - npm ci
            - npm run build
            - npm test
            {% elif values.imageBuilder == "s2i-java" %}
            - mvn clean package -DskipTests
            {% elif values.imageBuilder == "s2i-go" %}
            - go mod download
            - go build -o bin/app ./...
            - go test ./...
            {% endif %}
            {% endif %}
            # Docker build and push
            {% if values.imageRepository and values.imageUrl %}
            - docker build -t ${{ values.imageRepository }}/${{ values.imageUrl }}/${{ values.repoName }}:$BITBUCKET_COMMIT .
            - docker tag ${{ values.imageRepository }}/${{ values.imageUrl }}/${{ values.repoName }}:$BITBUCKET_COMMIT ${{ values.imageRepository }}/${{ values.imageUrl }}/${{ values.repoName }}:latest
            # Push to registry (requires docker login configuration)
            # - docker push ${{ values.imageRepository }}/${{ values.imageUrl }}/${{ values.repoName }}:$BITBUCKET_COMMIT
            # - docker push ${{ values.imageRepository }}/${{ values.imageUrl }}/${{ values.repoName }}:latest
            {% endif %}
            - echo "Deployment completed"

  pull-requests:
    '**':
      - step:
          name: Build and Test PR
          caches:
            - node
            - maven
          script:
            - echo "Building pull request..."
            {% if values.ci %}
            {% if values.imageBuilder == "s2i-nodejs" %}
            - npm ci
            - npm run build
            - npm test
            {% elif values.imageBuilder == "s2i-java" %}
            - mvn clean test
            {% elif values.imageBuilder == "s2i-go" %}
            - go mod download
            - go build ./...
            - go test ./...
            {% endif %}
            {% endif %}
            - echo "PR validation completed"

definitions:
  caches:
    maven: ~/.m2/repository
  
  services:
    docker:
      memory: 2048

# Pipeline options
options:
  docker:
    memory: 2048
  
  # Enable pipeline caching
  caches:
    enabled: true