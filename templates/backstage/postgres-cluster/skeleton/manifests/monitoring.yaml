{% if values.enableMonitoring %}
apiVersion: v1
kind: Service
metadata:
  name: {{ values.clusterName }}-metrics
  namespace: {{ values.namespace }}
  labels:
    env: {{ values.envName }}
    cluster-name: {{ values.clusterName }}
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ values.clusterName }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - port: 9187
      targetPort: 9187
      protocol: TCP
      name: metrics
  selector:
    postgresql: {{ values.clusterName }}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ values.clusterName }}-postgres
  namespace: {{ values.namespace }}
  labels:
    env: {{ values.envName }}
    cluster-name: {{ values.clusterName }}
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ values.clusterName }}
spec:
  selector:
    matchLabels:
      postgresql: {{ values.clusterName }}
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ values.clusterName }}-postgres-alerts
  namespace: {{ values.namespace }}
  labels:
    env: {{ values.envName }}
    cluster-name: {{ values.clusterName }}
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ values.clusterName }}
spec:
  groups:
    - name: postgresql-{{ values.clusterName }}
      rules:
        - alert: PostgreSQLDown
          expr: pg_up{job="{{ values.clusterName }}-postgres"} == 0
          for: 5m
          labels:
            severity: critical
            cluster: {{ values.clusterName }}
            namespace: {{ values.namespace }}
          annotations:
            summary: "PostgreSQL instance is down"
            description: "PostgreSQL instance {{ values.clusterName }} in namespace {{ values.namespace }} has been down for more than 5 minutes."

        - alert: PostgreSQLHighConnections
          expr: pg_stat_database_numbackends{job="{{ values.clusterName }}-postgres"} / pg_settings_max_connections{job="{{ values.clusterName }}-postgres"} > 0.8
          for: 5m
          labels:
            severity: warning
            cluster: {{ values.clusterName }}
            namespace: {{ values.namespace }}
          annotations:
            summary: "PostgreSQL high connection usage"
            description: "PostgreSQL instance {{ values.clusterName }} is using more than 80% of max connections."

        - alert: PostgreSQLReplicationLag
          expr: pg_replication_lag{job="{{ values.clusterName }}-postgres"} > 30
          for: 5m
          labels:
            severity: warning
            cluster: {{ values.clusterName }}
            namespace: {{ values.namespace }}
          annotations:
            summary: "PostgreSQL replication lag is high"
            description: "PostgreSQL replication lag for {{ values.clusterName }} is {{ $value }} seconds."

        - alert: PostgreSQLDiskSpaceUsage
          expr: (pg_database_size_bytes{job="{{ values.clusterName }}-postgres"} / (1024^3)) > {{ (values.storageSize | replace('Gi', '') | int * 0.8) }}
          for: 10m
          labels:
            severity: warning
            cluster: {{ values.clusterName }}
            namespace: {{ values.namespace }}
          annotations:
            summary: "PostgreSQL disk usage is high"
            description: "PostgreSQL database size for {{ values.clusterName }} is approaching storage limit."

        - alert: PostgreSQLLongRunningTransaction
          expr: max(pg_stat_activity_max_tx_duration{job="{{ values.clusterName }}-postgres"}) > 300
          for: 10m
          labels:
            severity: warning
            cluster: {{ values.clusterName }}
            namespace: {{ values.namespace }}
          annotations:
            summary: "PostgreSQL long running transaction"
            description: "PostgreSQL has a transaction running for more than 5 minutes in {{ values.clusterName }}."
{% endif %}