apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.repoName | lower }}
  description: GitOps configuration repository for ${{ values.chartName }} PostgreSQL database multi-environment deployments
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/managed-by-location: scaffolder
    backstage.io/managed-by-origin-location: template:postgres-database
    backstage.io/source-location: url:https://cnoe.localtest.me:8443/gitea/giteaAdmin/${{ values.repoName }}
  tags:
    - gitops
    - database
    - postgresql
    - bitnami
    - multi-environment
    - ${{ values.chartName }}
  links:
    - url: https://cnoe.localtest.me:8443/gitea/giteaAdmin/${{ values.repoName }}
      title: GitOps Repository
      icon: code
    - url: https://cnoe.localtest.me:8443/argocd/applications
      title: ArgoCD Applications
      icon: dashboard
    - url: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
      title: PostgreSQL Chart Documentation
      icon: docs
spec:
  type: gitops-repository
  lifecycle: experimental
  owner: platform-team
  dependsOn:
    - resource:default/postgresql-cluster