apiVersion: v1
kind: Secret
metadata:
  name: ${{ serviceName }}-database
  namespace: ${{ namespace }}
  labels:
    app.kubernetes.io/name: ${{ serviceName }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: backstage
    environment: ${{ envName }}
  annotations:
    backstage.io/managed-by-location: scaffolder
    backstage.io/managed-by-origin-location: template:database-request
type: Opaque
data:
  # These values will be populated by the database initialization job
  database-url: "" # postgresql://username:password@host:port/database
  host: "" # Base64 encoded PostgreSQL host
  port: "" # Base64 encoded PostgreSQL port (5432)
  database: "" # Base64 encoded database name
  username: "" # Base64 encoded database user
  password: "" # Base64 encoded database password