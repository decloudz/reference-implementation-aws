# ================================================================
# Auth Service Configuration Values - ${{ envName }} Environment
# ================================================================
#
# This file contains the values for the ${{ chartName }} Helm chart.
# Chart repository: ${{ chartRepo }}
# Chart version: ${{ chartVersion }}
#
# Environment: ${{ envName }}
# Namespace: ${{ namespace }}
# ================================================================

# Application Image
image:
  registry: "ac-m2repo-prod.asset-control.com:5443"
  repository: "ac-m2repo-prod.asset-control.com:5443/authentication-service"
  name: authentication-service
  tag: ${{ imageTag }}
  pullPolicy: Always
  port: 9000
  args: ["-Dplay.http.context=/"]

  containerEnvs:
    - name: PASSWORD_STRENGTH_CHECK_ENABLED
      value: "true"
    - name: DB_URL
      valueFrom:
        secretKeyRef:
          name: authentication-service-secrets
          key: jdbc-url
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: authentication-service-secrets
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentication-service-secrets
          key: password
    - name: KEYSTORE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentication-service-secrets
          key: keystore-password
    - name: KEY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentication-service-secrets
          key: key-password
    - name: KEYSTORE_FILE
      value: "/opt/docker/conf/external/keystore.jks"

# Service Configuration
serviceMemory: 2G
serviceConfigPath: "/opt/docker/conf/load"

# Environment-specific settings
namespace: ${{ namespace }}

# Security Configuration
keystoreEnabled: true
authEnabled: true
secretName: authentication-service-secrets

# Volume Mounts for Keystore
volumeMounts: []

volumes: []

# Container Environment Variables


# Service Account Configuration  
serviceAccountName: auth-service-sa
serviceAccountRoleArn: "arn:aws:iam::696513474302:role/secrets-csi-role"

# Secret Store Configuration
secretStoreName: "${{ envName }}-auth-secret-store"
awsRegion: "us-east-1"
externalSecretName: "${{ envName }}-auth-secret"

# AWS Secrets Manager Configuration
secman_name: "${{ envName }}/ops360/auth-service"

# Vault/CSI Driver Configuration
vault:
  keystoreSecretName: auth-service-keystore-secrets
  secrets:
    - objectName: "arn:aws:secretsmanager:us-east-1:696513474302:secret:${{ envName }}/ops360/auth-service-guKEPM"
      objectType: "secretsmanager"
      objectVersionLabel: "AWSCURRENT"
      jmesPath:
        - path: "POSTGRES_USERNAME"
          objectAlias: "POSTGRES_USERNAME"
        - path: "POSTGRES_PASSWORD"
          objectAlias: "POSTGRES_PASSWORD"
        - path: "POSTGRES_DATABASE"
          objectAlias: "POSTGRES_DATABASE"
        - path: "POSTGRES_HOST"
          objectAlias: "POSTGRES_HOST"
        - path: "POSTGRES_PORT"
          objectAlias: "POSTGRES_PORT"
        - path: "POSTGRES_URL"
          objectAlias: "POSTGRES_URL"

# Service Configuration
service:
  type: ClusterIP
  port: 9000

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  domain: ${{ domain }}
  prefix: /auth(/|$)(.*)
  pathType: ImplementationSpecific
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
    nginx.ingress.kubernetes.io/server-snippet: |-
      add_header X-Request-ID $request_id;
      keepalive_timeout 70;
      underscores_in_headers on;
      proxy_http_version 1.1;
      client_max_body_size 0;
      client_header_buffer_size 4096k;
      large_client_header_buffers 4 8096k;
      gzip  on;
      gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
    nginx.ingress.kubernetes.io/configuration-snippet: |-
      more_set_headers "Cache-Control: no-cache";
    nginx.ingress.kubernetes.io/proxy-buffer-size: "24576k"
    nginx.ingress.kubernetes.io/client-body-buffer-size: 200M
    nginx.ingress.kubernetes.io/rewrite-target: /$2

# Resource Configuration
resources: {}
# Example resource limits:
# resources:
#   limits:
#     cpu: 500m
#     memory: 2Gi
#   requests:
#     cpu: 250m
#     memory: 1Gi

# Scaling Configuration
replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node Assignment
nodeSelector: {}
tolerations: []
affinity: {}

# Extra Kubernetes manifests
extraManifests: []