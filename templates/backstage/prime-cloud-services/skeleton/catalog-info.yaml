apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ repoName | lower }}
  description: GitOps configuration repository for ${{ chartName }} multi-environment deployments
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/managed-by-location: scaffolder
    backstage.io/managed-by-origin-location: template:prime-edm-auth-service
    backstage.io/source-location: url:https://cnoe.localtest.me:8443/gitea/giteaAdmin/${{ repoName }}
  tags:
    - gitops
    - helm
    - multi-environment
    - ${{ chartName }}
  links:
    - url: https://cnoe.localtest.me:8443/gitea/giteaAdmin/${{ repoName }}
      title: GitOps Repository
      icon: code
    - url: https://cnoe.localtest.me:8443/argocd/applications
      title: ArgoCD Applications
      icon: dashboard
spec:
  type: gitops-repository
  lifecycle: experimental
  owner: platform-team
