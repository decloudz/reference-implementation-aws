    # -- Enable autoscaling for the replicator
    enabled: false
    # -- Minimum autoscaling replicas for the replicator
    minReplicas: 1
    # -- Maximum autoscaling replicas for the replicator
    maxReplicas: 3
    # -- Target CPU utilisation percentage for the replicator
    targetCPUUtilizationPercentage: 60
    # -- Target memory utilisation percentage for the replicator
    targetMemoryUtilizationPercentage: null
