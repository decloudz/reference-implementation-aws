# Deployment configuration for applications
deploy:
  # Whether to deploy Postgres (database) as part of this Helm release
  postgres: False
  # Whether to deploy Cassandra (database) as part of this Helm release
  cassandra: False
  # Whether to deploy Hazelcast (cache) as part of this Helm release
  hazelcast: true
  # Whether to deploy Kafka (message broker) as part of this Helm release
  kafka: False


hazelcast:
  enabled: true
  persistence:
    enabled: true
    accessModes:
    - ReadWriteOnce
    size: 8Gi
    storageClass: gp2
  yaml:
    hazelcast:
      network:
        join:
          kubernetes:
            enabled: true
            service-name: ${serviceName}
            namespace: ${namespace}
        rest-api:
          enabled: true
      jet:
        enabled: ${hz.jet.enabled}
  # Security Context properties
  securityContext:
    # enabled is a flag to enable Security Context
    enabled: false
    # runAsUser is the user ID used to run the container
    runAsUser: 65534
    # runAsGroup is the primary group ID used to run all processes within any container of the pod
    runAsGroup: 65534
  mancenter:
    # Hazelcast Management Center Service properties
    service:
      type: ClusterIP
  env: 
    - name: MC_DEFAULT_CLUSTER
      value: "hz-cluster"
    - name: MC_DEFAULT_CLUSTER_MEMBERS
      value: "hazelcast"
    - name: MC_ADMIN_USER
      value: "admin"
    - name: MC_ADMIN_PASSWORD
      value: "zoolaiV7"
    - name: HZ_CLUSTERNAME
      value: "hz-cluster"
    - name: HZ_CPSUBSYSTEM_CPMEMBERCOUNT
      value: "3"
    - name: HZ_NETWORK_RESTAPI_ENABLED
      value: "true"
    - name: HZ_NETWORK_RESTAPI_ENDPOINTGROUPS.CP.ENABLED
      value: "true"
    # - name: HZ_NETWORK_JOIN_MULTICAST_ENABLED
    #   value: "false"
    # - name: HZ_NETWORK_JOIN_KUBERNETES_ENABLED
    #   value: "true"
    # - name: HZ_NETWORK_JOIN_KUBERNETES_SERVICEDNS
    #   value: "hazelcast"
  ingress:
    enabled: false
    annotations: {}
    className: nginx
    hosts:
    - hazelcast-mancenter.cluster.domain
    tls:
    - secretName: hazelcast-ingress-tls
      hosts:
      - hazelcast-mancenter.cluster.domain


prime:
  # -- If set, these annotations are added to all of the Kubernetes controllers
  # (Deployments, StatefulSets, etc) that this chart launches. Use this to
  # implement something like the "Wave" controller or another controller that
  # is monitoring top level deployment resources.
  annotations: {}
  # Configures the readiness probe for all of the prime pods
  readinessProbe: {}
  # httpGet:
  #   path: /ready
  #   port: http
  # initialDelaySeconds: 30
  # timeoutSeconds: 1
  livenessProbe: {}
  # httpGet:
  #   path: /ready
  #   port: http
  # initialDelaySeconds: 300
  image:
    # -- The Docker registry
    registry: ac-m2repo-prod.asset-control.com:5443
    # -- Docker image repository
    repository: prime
    # -- Overrides the image tag whose default is the chart's appVersion
    tag: null
    # -- Docker image pull policy
    pullPolicy: IfNotPresent
  # -- Common labels for all pods
  podLabels: {}
  # -- Common annotations for all pods
  podAnnotations: {}
  # -- Common command override for all pods (except gateway)
  command: null
  # -- The number of old ReplicaSets to retain to allow rollback
  revisionHistoryLimit: 10
  # -- The SecurityContext for Prime pods
  podSecurityContext: {}
  # fsGroup: 10001
  # runAsGroup: 10001
  # runAsNonRoot: true
  # runAsUser: 10001
  # -- The SecurityContext for Prime containers
  containerSecurityContext: {}
  # readOnlyRootFilesystem: true
  # capabilities:
  #   drop:
  #     - ALL
  # allowPrivilegeEscalation: false
  # -- Specify an existing secret containing Prime license. If non-empty, overrides `prime.secret`
  existingSecretForLicense: ""
  # -- Store the Prime License as a secret.
  licenseAsSecret: false
  # -- Adds the appProtocol field to the memberlist service. This allows memberlist to work with istio protocol selection. Ex: "http" or "tcp"
  appProtocol: ""
  # -- Common annotations for all prime services
  serviceAnnotations: {}
  # Prime server configuration
  # Refers to Prime Documentation
  server: {}
  # -- HTTP server listen port
  # http_listen_port: 3100
  # -- Config file contents for Prime
  serviceAccount:
    # -- Create query service account
    create: true
    # -- query service account name
    name: prime
    # -- Annotations applied to created service account
    annotations: {}
    # -- Automount API credentials for the Service Account
    automountServiceAccountToken: true
# Administrator credentials when not using an existing secret (see below)
adminUser: "prime"
adminPassword: "password"
# # Use an existing secret for the admin user.
admin:
  ## Name of the secret. Can be templated.
  existingSecret: ""
  userKey: admin-user
  passwordKey: admin-password
