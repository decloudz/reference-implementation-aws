# Deployment configuration for applications
# Query component settings
query:
  enabled: true
  # -- Kind of deployment [StatefulSet/Deployment]
  kind: StatefulSet
  # -- Number of replicas for the query
  replicas: 1
  # -- hostAliases to add
  hostAliases: []
  #  - ip: 1.2.3.4
  #    hostnames:
  #      - domain.tld
  autoscaling:
    # -- Enable autoscaling for the query
    enabled: false
    # -- Minimum autoscaling replicas for the query
    minReplicas: 1
    # -- Maximum autoscaling replicas for the query
    maxReplicas: 3
    # -- Target CPU utilisation percentage for the query
    targetCPUUtilizationPercentage: 60
    # -- Target memory utilisation percentage for the query
    targetMemoryUtilizationPercentage: null
    # -- Allows one to define custom metrics using the HPA/v2 schema (for example, Pods, Object or External metrics)
    customMetrics: []
    # - type: Pods
    #   pods:
    #     metric:
    #       name: prime_lines_total
    #     target:
    #       type: AverageValue
    #       averageValue: 10k
    behavior:
      # -- Enable autoscaling behaviours
      enabled: false
      # -- define scale down policies, must conform to HPAScalingRules
      scaleDown: {}
      # -- define scale up policies, must conform to HPAScalingRules
      scaleUp: {}
  image:
    # -- The Docker registry for the query image. Overrides `prime.image.registry`
    registry: ac-m2repo-prod.asset-control.com:5443
    # -- Docker image repository for the query image. Overrides `prime.image.repository`
    repository: prime/query-server
    # -- Docker image tag for the query image. Overrides `prime.image.tag`
    tag: 1.0.5
  # -- Command to execute instead of defined in Docker image
  command: null
  # -- The name of the PriorityClass for query pods
  priorityClassName: null
  serviceAccount:
    # -- Create query service account
    create: false
    # -- query service account name
    name: prime
    # -- Annotations applied to created service account
    annotations: {}
    # -- Automount API credentials for the Service Account
    automountServiceAccountToken: true
  # -- Labels for query pods
  podLabels: {}
  # -- Annotations for query pods
  podAnnotations: {}
  # -- Labels for ingestor service
  serviceLabels: {}
  # -- Additional CLI args for the query
  extraArgs: []
  # -- Environment variables to add to the query pods
  extraEnv:
    - name: INSTALLATION_NAME
      value: "dev"
    - name: DB_HOST
      value: "postgresql-dev"
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "dev_prime_cloud_db"
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: prime-cloud-secrets
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: prime-cloud-secrets
          key: password
    - name: AC_QRY_SVC_NAME
      value: "prime-query-rpc"
    - name: AC_UPD_SVC_NAME
      value: "prime-update-rpc"
    - name: AC_REP_SVC_NAME
      value: "prime-replicator-rpc"
    - name: NUM_THREADS
      value: "4"
    - name: NUM_DB_CONNECTIONS
      value: "4"
    - name: CASSANDRA_HOST
      value: "cassandra-dev"
    - name: CASSANDRA_PORT
      value: "9042"
    - name: CASSANDRA_USER
      value: "bp+2-at-696513474302"
    - name: CASSANDRA_PASSWORD
      value: "K4ayQzQNoVLsjmJwMsvgDEmh8PnADmsWiIRDTlwqMfgCVoqgMF1e+yK5MsI="
    - name: CASSANDRA_INSTALL_SCHEMA
      value: "1"
    - name: CASSANDRA_SSL
      value: "1"
    - name: CASSANDRA_SSL_CERTFILE
      value: "/etc/ssl/certs/ca-bundle.crt"
    - name: CASSANDRA_DC
      value: "eu-west-1"
    - name: CASSANDRA_AWS_KEYSPACES
      value: "true"
    - name: CASSANDRA_AWS_SIGV4
      value: "false"
    - name: CASSANDRA_WRITE_CONSISTENCY
      value: "LOCAL_QUORUM"
    - name: CASSANDRA_READ_CONSISTENCY
      value: "LOCAL_QUORUM"
    - name: TS_CASSANDRA_LOCK_MAX_WAIT_TIME
      value: "60000"
    - name: CASSANDRA_MAX_STATEMENTS_PER_BATCH
      value: "29"
    - name: TS_CASSANDRA_WRITE_CONSISTENCY
      value: "LOCAL_QUORUM"
    - name: TS_CASSANDRA_MAX_RETRIES
      value: "3"
    - name: TS_CASSANDRA_RETRIES_WAIT_TIME
      value: "100"
    - name: HDFS_LOG_HOST
      value: "dev-hdfs-namenode"
    - name: HDFS_USER
      value: "stackable"
    - name: HDFS_LOG_PORT
      value: "8020"
    - name: HDFS_ROOT
      value: "/alveo/files/"
    - name: HAZELCAST_HOST
      value: "prime-cloud-hazelcast"
    - name: HAZELCAST_CLUSTER
      value: "hz-cluster"
  # -- Environment variables from secrets or configmaps to add to the query pods
  extraEnvFrom: []
  # -- Volume mounts to add to the query pods
  extraVolumeMounts: []
  # -- Volumes to add to the query pods
  extraVolumes: []
  # -- Resource requests and limits for the query
  resources: {}
  # -- Containers to add to the query pods
  extraContainers: []
  # -- Init containers to add to the query pods
  initContainers:
    - name: init-prime
      image: ac-m2repo-prod.asset-control.com:5443/prime/init-prime-server:1.0.2
      env:
        - name: INSTALLATION_NAME
          value: dev
        - name: DB_HOST
          value: "postgres.poc.alveo-sandbox.net"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "prime"
        - name: DB_USER
          value: "prime"
        - name: DB_PASSWORD
          value: "password"
        - name: CASSANDRA_HOST
          value: "cassandra.eu-west-1.amazonaws.com"
        - name: CASSANDRA_PORT
          value: "9142"
        - name: CASSANDRA_USER
          value: "bp+2-at-696513474302"
        - name: CASSANDRA_PASSWORD
          value: "K4ayQzQNoVLsjmJwMsvgDEmh8PnADmsWiIRDTlwqMfgCVoqgMF1e+yK5MsI="
        - name: CREATE_CASSANDRA_KEYSPACE
          value: "1"
        - name: CASSANDRA_INSTALL_SCHEMA
          value: "1"
        - name: CASSANDRA_SSL
          value: "1"
        - name: CASSANDRA_SSL_CERTFILE
          value: "/etc/ssl/certs/ca-bundle.crt"
        - name: CASSANDRA_DC
          value: "eu-west-1"
        - name: CASSANDRA_AWS_KEYSPACES
          value: "true"
        - name: CASSANDRA_AWS_SIGV4
          value: "false"
      volumeMounts:
        - name: prime-server-license-volume
          mountPath: /home/prime/config/license.txt
          subPath: license.txt
  # -- Grace period to allow the query to shutdown before it is killed. Especially for the ingestor,
  # this must be increased. It must be long enough so querys can be gracefully shutdown flushing/transferring
  # all data and to successfully leave the member ring on shutdown.
  terminationGracePeriodSeconds: 300
  # -- Lifecycle for the query container
  lifecycle: {}
  # -- topologySpread for query pods. Passed through `tpl` and, thus, to be configured as string
  # @default -- Defaults to allow skew no more then 1 node per AZ
  topologySpreadConstraints: |
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          {{- include "prime.querySelectorLabels" . | nindent 6 }}
  # -- Affinity for query pods. Passed through `tpl` and, thus, to be configured as string
  # @default -- Hard node and soft zone anti-affinity
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              {{- include "prime.querySelectorLabels" . | nindent 10 }}
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "prime.querySelectorLabels" . | nindent 12 }}
            topologyKey: failure-domain.beta.kubernetes.io/zone
  # -- Pod Disruption Budget maxUnavailable
  maxUnavailable: null
  # -- Max Surge for query pods
  maxSurge: 0
  # -- Node selector for query pods
  nodeSelector: {}
  # -- Tolerations for query pods
  tolerations: []
  # -- readiness probe settings for query pods. If empty, use `prime.readinessProbe`
  readinessProbe: {}
  # -- liveness probe settings for query pods. If empty use `prime.livenessProbe`
  livenessProbe: {}
  persistence:
    # -- Enable creating PVCs which is required when using boltdb-shipper
    enabled: false
    # -- Use emptyDir with ramdisk for storage. **Please note that all data in query will be lost on pod restart**
    inMemory: false
    # -- List of the query PVCs
    # @notationType -- list
    claims:
      - name: data
        size: 1Gi
        #   -- Storage class to be used.
        #   If defined, storageClassName: <storageClass>.
        #   If set to "-", storageClassName: "", which disables dynamic provisioning.
        #   If empty or set to null, no storageClassName spec is
        #   set, choosing the default provisioner (gp2 on AWS, standard on GKE, AWS, and OpenStack).
        storageClass: gp3
        # - name: wal
        #   size: 150Gi
    # -- Enable StatefulSetAutoDeletePVC feature
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain
  service:
    # -- Ports of the query service    
    ports:
      - port: 9932
        name: prime-query-rpc
    # -- Type of the query service
    type: ClusterIP
    # -- ClusterIP of the query service
    clusterIP: null
    # -- Node port if service type is NodePort
    nodePort: null
    # -- Load balancer IPO address if service type is LoadBalancer
    loadBalancerIP: null
    # -- Load balancer allow traffic from CIDR list if service type is LoadBalancer
    loadBalancerSourceRanges: []
    # -- Annotations for the query service
    annotations: {}
    # -- Labels for query service
    labels: {}
