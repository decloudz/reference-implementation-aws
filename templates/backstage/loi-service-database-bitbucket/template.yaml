apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-bitbucket-loi-service-database
  title: Request Database for LOI Service (Bitbucket)
  description: |
    Request a new database for the LOI (Letter of Intent) Service in a specific environment.
    
    Creates:
    - New database in shared PostgreSQL cluster
    - Database user with appropriate permissions
    - Kubernetes secret with connection details
    - Pre-configured for LOI service requirements
  
spec:
  owner: platform-team
  type: database-request
  parameters:
    - title: Repository Settings
      required: [workspace]
      properties:
        workspace:
          type: string
          description: Bitbucket workspace
          default: your-workspace
          ui:help: "Bitbucket workspace name"
          
    - title: Environment Configuration (Bitbucket)
      required: [envName]
      properties:
        envName:
          type: string
          description: Environment where database is needed
          enum:
            - dev
            - staging
            - prod
          ui:help: 'Target environment for the LOI service database'
        namespace:
          type: string
          description: Kubernetes namespace for the LOI service
          default: ${{ parameters.envName }}
          ui:help: 'Namespace where your LOI service runs (defaults to environment name)'

    - title: Database Configuration (Pre-configured for LOI Service) (Bitbucket)
      properties:
        databaseName:
          type: string
          description: Database name (with environment prefix)
          default: ${{ parameters.envName }}_loi_db
          pattern: '^[a-z][a-z0-9_]*$'
          ui:help: 'Database name for LOI service (e.g., dev_loi_db)'
        dbUser:
          type: string
          description: Database username (with environment prefix)
          default: ${{ parameters.envName }}_loi_service_user
          pattern: '^[a-z][a-z0-9_]*$'
          ui:help: 'Database user for LOI service (e.g., dev_loi_service_user)'
        
    - title: PostgreSQL Cluster (Bitbucket)
      properties:
        postgresCluster:
          type: string
          description: PostgreSQL cluster name
          default: postgresql
          ui:help: 'Name of the existing PostgreSQL cluster to create database in'
        postgresNamespace:
          type: string
          description: PostgreSQL namespace
          default: ${{ parameters.envName }}
          ui:help: 'Namespace where PostgreSQL cluster is deployed'

  steps:
    - id: fetch-db-config
      name: Generate Database Configuration
-bitbucket      action: fetch:template
      input:
        url: ../database-request/skeleton
        targetPath: ./database-config/loi-service
        values:
          workspace: ${{ parameters.workspace }}
          serviceName: loi-service
          envName: ${{ parameters.envName }}
          namespace: ${{ parameters.namespace }}
          databaseName: ${{ parameters.databaseName }}
          dbUser: ${{ parameters.dbUser }}
          postgresCluster: ${{ parameters.postgresCluster }}
          postgresNamespace: ${{ parameters.postgresNamespace }}
          targetRepo: loi-service-db-setup

    - id: create-db-job
      name: Create Database Initialization Job
-bitbucket      action: fetch:template
      input:
        url: ../database-request/job-template
        targetPath: ./manifests
        values:
          workspace: ${{ parameters.workspace }}
          serviceName: loi-service
          envName: ${{ parameters.envName }}
          namespace: ${{ parameters.namespace }}
          databaseName: ${{ parameters.databaseName }}
          dbUser: ${{ parameters.dbUser }}
          postgresCluster: ${{ parameters.postgresCluster }}
          postgresNamespace: ${{ parameters.postgresNamespace }}

    - id: publish-config
      name: Create Repository with Database Configuration
-bitbucket      action: publish:bitbucket
      input:
        gitAuthorName: Backstage
        gitAuthorEmail: backstage@example.com
        description: Database configuration for LOI Service in ${{ parameters.envName }}
        repoUrl: bitbucket.org?workspace=${{ parameters.workspace }}&repo=loi-service-db-setup
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD Application for Database Setup
-bitbucket      action: cnoe:create-argocd-app
      input:
        appName: loi-service-database-setup
        appNamespace: argocd
        argoInstance: in-cluster
        projectName: default
        repoUrl: https://bitbucket.org/${{ parameters.workspace }}/loi-service-db-setup
        path: manifests
        targetRevision: main
        destination:
          server: https://kubernetes.default.svc
          namespace: ${{ parameters.postgresNamespace }}
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

    - id: wait-for-sync
      name: Wait for ArgoCD Application Sync
-bitbucket      action: debug:wait
      input:
        seconds: 15

    - id: validate-db
      name: Validate Database Creation
-bitbucket      action: debug:log
      input:
        message: |
          Database setup initiated for: **LOI Service**
          
          ## ✅ What was created:
          
          📁 **Repository**: loi-service-db-setup
          🚀 **ArgoCD App**: loi-service-database-setup
          🗄️ **Database Name**: ${{ parameters.databaseName }}
          👤 **Database User**: ${{ parameters.dbUser }}
          🔐 **Target Secret**: loi-service-database
          📦 **Target Namespace**: ${{ parameters.namespace }}

  output:
    links:
      - title: Database Setup ArgoCD App (Bitbucket)
        url: https://cnoe.localtest.me:8443/argocd/applications/argocd/loi-service-database-setup
      - title: Database Configuration Repository (Bitbucket)
        url: https://bitbucket.org/${{ parameters.workspace }}/loi-service-db-setup
    text:
      - title: LOI Service Database Request Summary (Bitbucket)
        content: |
          Your database has been requested for the **LOI Service**!
          
          - **Service**: LOI Service
          - **Environment**: ${{ parameters.envName }}
          - **Database**: ${{ parameters.databaseName }}
          - **Secret**: loi-service-database