# Application Image
image:
  registry: "ac-m2repo-prod.asset-control.com:5443"
  name: core-ui
  repository: core-ui
  tag: "1.2.1"
  pullPolicy: IfNotPresent
  port: 8080
  command:
    - /bin/sh
    - -c
    - |
      nginx-debug -g "daemon off;"
  containerEnvs: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podLabels:
  project: poc
  suite: Ops360
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000


# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: ops360.localtest.me
      paths:
        - path: /
          pathType: Prefix
  domain: ops360.localtest.me
  prefix: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"



# Resource Configuration
resources: {}
# Example resource limits:
# resources:
#   limits:
#     cpu: 500m
#     memory: 2Gi
#   requests:
#     cpu: 250m
#     memory: 1Gi

# Scaling Configuration
replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node Assignment
nodeSelector: {}
tolerations: []
affinity: {}

# Extra Kubernetes manifests  
extraManifests: []