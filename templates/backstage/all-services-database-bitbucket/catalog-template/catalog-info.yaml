apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: platform-databases-${{ values.envName }}
  title: Platform Databases (${{ values.envName | title }})
  description: All platform service databases for ${{ values.envName }} environment
  annotations:
    backstage.io/managed-by-location: scaffolder
    backstage.io/managed-by-origin-location: template:all-services-database
    github.com/project-slug: giteaAdmin/platform-services-databases-${{ values.envName }}
  tags:
    - database
    - platform
    - ${{ values.envName }}
  links:
    - url: https://cnoe.localtest.me:8443/gitea/giteaAdmin/platform-services-databases-${{ values.envName }}
      title: Repository
      icon: github
    - url: https://cnoe.localtest.me:8443/argocd/applications?search=database-setup-${{ values.envName }}
      title: All Database ArgoCD Apps
      icon: deployment
spec:
  owner: platform-team
---
{% if values.createAuthDb %}
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: authentication-service-database-${{ values.envName }}
  title: Authentication Service Database (${{ values.envName | title }})
  description: PostgreSQL database for authentication service in ${{ values.envName }} environment
  annotations:
    backstage.io/managed-by-location: scaffolder
    backstage.io/managed-by-origin-location: template:all-services-database
    argocd/app-name: authentication-service-database-setup-${{ values.envName }}
    github.com/project-slug: giteaAdmin/platform-services-databases-${{ values.envName }}
  tags:
    - database
    - postgresql
    - authentication
    - ${{ values.envName }}
  links:
    - url: https://cnoe.localtest.me:8443/argocd/applications/argocd/authentication-service-database-setup-${{ values.envName }}
      title: ArgoCD Application
      icon: deployment
spec:
  type: database
  lifecycle: production
  owner: platform-team
  system: platform-databases-${{ values.envName }}
  dependsOn:
    - resource:default/postgresql-${{ values.envName }}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: authentication-service-database-secret-${{ values.envName }}
  title: Authentication Service Database Secret (${{ values.envName | title }})
  description: Kubernetes secret containing database connection details for authentication service
  annotations:
    backstage.io/managed-by-location: scaffolder
    kubernetes.io/secret-name: authentication-service-database
    kubernetes.io/namespace: ${{ values.namespace }}
  tags:
    - secret
    - database
    - authentication
    - ${{ values.envName }}
spec:
  type: k8s-secret
  lifecycle: production
  owner: platform-team
  system: platform-databases-${{ values.envName }}
  dependsOn:
    - component:default/authentication-service-database-${{ values.envName }}
---
{% endif %}

