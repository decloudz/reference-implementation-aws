apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-prime-cloud-database
  title: Request Database for Prime Cloud
  description: |
    Request a new database for the Prime Cloud platform in a specific environment.
    
    Creates:
    - New database in shared PostgreSQL cluster
    - Database user with appropriate permissions
    - Kubernetes secret with connection details
    - Pre-configured for Prime Cloud platform requirements
  
spec:
  owner: platform-team
  type: database-request
  parameters:
    - title: Environment Configuration
      required: [envName]
      properties:
        envName:
          type: string
          description: Environment where database is needed
          enum: [dev, staging, prod]
          ui:help: 'Target environment for the Prime Cloud database'
        namespace:
          type: string
          description: Kubernetes namespace for Prime Cloud
          default: ${{ parameters.envName }}

    - title: Database Configuration (Pre-configured for Prime Cloud)
      properties:
        databaseName:
          type: string
          description: Database name (with environment prefix)
          default: ${{ parameters.envName }}_prime_cloud_db
          pattern: '^[a-z][a-z0-9_]*$'
          ui:help: 'Database name for Prime Cloud (e.g., dev_prime_cloud_db)'
        dbUser:
          type: string
          description: Database username (with environment prefix)
          default: ${{ parameters.envName }}_prime_cloud_user
          pattern: '^[a-z][a-z0-9_]*$'
          ui:help: 'Database user for Prime Cloud (e.g., dev_prime_cloud_user)'
        
    - title: PostgreSQL Cluster
      properties:
        postgresCluster:
          type: string
          description: PostgreSQL cluster name
          default: postgresql
        postgresNamespace:
          type: string
          description: PostgreSQL namespace
          default: ${{ parameters.envName }}

  steps:
    - id: fetch-db-config
      name: Generate Database Configuration
      action: fetch:template
      input:
        url: ../database-request/skeleton
        targetPath: ./database-config/prime-cloud
        values:
          serviceName: prime-cloud
          envName: ${{ parameters.envName }}
          namespace: ${{ parameters.namespace }}
          databaseName: ${{ parameters.databaseName }}
          dbUser: ${{ parameters.dbUser }}
          postgresCluster: ${{ parameters.postgresCluster }}
          postgresNamespace: ${{ parameters.postgresNamespace }}
          targetRepo: prime-cloud-db-setup

    - id: create-db-job
      name: Create Database Initialization Job
      action: fetch:template
      input:
        url: ../database-request/job-template
        targetPath: ./manifests
        values:
          serviceName: prime-cloud
          envName: ${{ parameters.envName }}
          namespace: ${{ parameters.namespace }}
          databaseName: ${{ parameters.databaseName }}
          dbUser: ${{ parameters.dbUser }}
          postgresCluster: ${{ parameters.postgresCluster }}
          postgresNamespace: ${{ parameters.postgresNamespace }}

    - id: publish-config
      name: Create Repository with Database Configuration
      action: publish:gitea
      input:
        description: Database configuration for Prime Cloud in ${{ parameters.envName }}
        repoUrl: cnoe.localtest.me:8443/gitea?repo=prime-cloud-db-setup
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD Application for Database Setup
      action: cnoe:create-argocd-app
      input:
        appName: prime-cloud-database-setup
        appNamespace: argocd
        argoInstance: in-cluster
        projectName: default
        repoUrl: https://cnoe.localtest.me:8443/gitea/giteaAdmin/prime-cloud-db-setup
        path: manifests
        targetRevision: main
        destination:
          server: https://kubernetes.default.svc
          namespace: ${{ parameters.postgresNamespace }}
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

  output:
    text:
      - title: Prime Cloud Database Request Summary
        content: |
          Database requested for **Prime Cloud** in ${{ parameters.envName }}!
          - Database: ${{ parameters.databaseName }}
          - Secret: prime-cloud-database